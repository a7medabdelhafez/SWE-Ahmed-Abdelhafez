.links{display:flex;gap:4px;font-size:.92rem;color:var(--mut);padding:5px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--bd)}

.wawrap{position:relative;border-radius:12px;display:inline-block}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

function build(){

function apply(){
  const L=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=L[e.dataset.i]);
  document.querySelectorAll("[data-p]").forEach(e=>{const[i,j]=e.dataset.p.split("");e.textContent=L.p[i][j]});
  $("#lang").dataset.l=lang;
  localStorage.setItem("lang",lang);type();observe();
}
function type(){
  clearTimeout(tw);const w=T[lang].typed,el=$("#typed");let i=0,j=0,del=false;
  (function t(){const s=w[i];el.textContent=s.slice(0,j);
    if(!del&&j===s.length){if(w.length===1)return;del=true;tw=setTimeout(t,1400);return}
    if(del&&j===0){del=false;i=(i+1)%w.length}
    j+=del?-1:1;tw=setTimeout(t,del?45:90)})();
}
let io;
function observe(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;
    e.target.classList.add("in");
    io.unobserve(e.target)}),{threshold:.15});
  document.querySelectorAll(".rv").forEach(e=>io.observe(e));
}
/* counters */
function counters(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const n=+el.dataset.count,sfx=el.hasAttribute("data-plus")?"+":"";let c=0;
    const step=()=>{c+=Math.max(.1,n/60);if(c>=n){el.textContent=n+sfx;return}el.textContent=Math.floor(c)+sfx;requestAnimationFrame(step)};
    step();
  });
}
